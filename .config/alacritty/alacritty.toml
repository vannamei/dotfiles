[general]
import = [
  "~/.config/alacritty/themes/themes/kanagawa_wave.toml"
]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
padding = { x = 10, y = 36}
decorations = "Transparent"
opacity = 0.82
startup_mode = "SimpleFullscreen"

[scrolling]
history = 100000
multiplier = 5

[font]
normal = { family = "HackGen Console NF", style = "Regular" }
bold = { family = "HackGen Console NF", style = "bold" }
italic = { family = "HackGen Console NF", style = "Italic" }
size = 11.0

[colors]
primary = { background = "#1a1b1e" }
